name: Temp Costamare Official Source Bundle

on:
  pull_request:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download untouched SEC source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          UA='Mozilla/5.0 (compatible; Costamare-source-bundle/1.0)'
          fetch() {
            local name="$1"
            local url="$2"
            echo "Downloading $name"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 180 -A "$UA" "$url" -o "sources/$name"
            test -s "sources/$name"
            sleep 0.3
          }
          fetch '01_CMRE_2024_20-F.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000114036125005199/form20f.htm'
          fetch '02_CMRE_Q1_2025_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184325002939/exh_991.htm'
          fetch '03_CMRE_Q1_2025_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184325002939/exh_992.htm'
          fetch '04_CMDB_H1_2025_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/2033535/000117184325005203/exh_991.htm'
          fetch '05_CMDB_H1_2025_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/2033535/000117184325005203/exh_992.htm'
          fetch '06_CMRE_Q2_2025_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184325004873/exh_991.htm'
          fetch '07_CMRE_Q2_2025_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184325004873/exh_992.htm'
          fetch '08_CMRE_Q3_2025_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184325006940/exh_991.htm'
          fetch '09_CMRE_Q3_2025_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184325006940/exh_992.htm'
          fetch '10_CMRE_FY2025_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184326000875/exh_991.htm'
          fetch '11_CMRE_FY2025_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184326000875/exh_992.htm'
          fetch '12_CMRE_2025_20-F.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000114036126007868/ef20064083_20f.htm'
          fetch '13_CMDB_FY2025_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/2033535/000117184326000957/exh_991.htm'
          fetch '14_CMDB_FY2025_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/2033535/000117184326000957/exh_992.htm'
          fetch '15_CMDB_2025_20-F.htm' 'https://www.sec.gov/Archives/edgar/data/2033535/000114036126011994/ef20066084_20f.htm'
          fetch '16_CMRE_Q1_2026_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184326002794/exh_991.htm'
          fetch '17_CMRE_Q1_2026_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184326002794/exh_992.htm'
          fetch '18_CMRE_Q2_2026_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184326004877/exh_991.htm'
          fetch '19_CMRE_Q2_2026_Financial_Report.htm' 'https://www.sec.gov/Archives/edgar/data/1503584/000117184326004877/exh_992.htm'
          fetch '20_CMDB_Q2_2026_Earnings_Release.htm' 'https://www.sec.gov/Archives/edgar/data/2033535/000117184326005131/exh_991.htm'
          count=$(find sources -maxdepth 1 -type f | wc -l | tr -d ' ')
          echo "Downloaded $count source files"
          test "$count" = "20"
          find sources -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload exact source files as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Costamare_20_Official_Full_Sources
          path: sources/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

name: Temp Costamare Official Source Bundle

on:
  pull_request:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download full official issuer source PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          UA='Mozilla/5.0 (compatible; Costamare-source-bundle/1.0)'
          fetch() {
            local name="$1"
            local url="$2"
            echo "Downloading $name"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 240 -A "$UA" "$url" -o "sources/$name"
            test -s "sources/$name"
            test "$(head -c 4 "sources/$name")" = "%PDF"
            sleep 0.2
          }
          fetch '01_CMRE_2024_Annual_Report.pdf' 'https://www.costamare.com/images/annual_reports/2024_annual_report.pdf'
          fetch '02_CMRE_Q1_2025_Earnings_Release.pdf' 'https://www.costamare.com/images/news/CMRE_Earnings_release_Q1_2025.pdf'
          fetch '03_CMDB_April_2025_Investor_Presentation.pdf' 'https://www.costamare.com/images/news/Costamare_Bulkers_Holdings_Limited_Investor_Presentation.pdf'
          fetch '04_CMDB_April_2025_Analyst_and_Investor_Day.pdf' 'https://www.costamarebulkers.com/images/news/Costamare_Bulkers_Analyst_and_Investor_Day.pdf'
          fetch '05_CMRE_Q2_2025_Earnings_Release.pdf' 'https://www.costamare.com/images/news/CMRE_Earnings_release_Q2_2025.pdf'
          fetch '06_CMRE_Q2_2025_Earnings_Presentation.pdf' 'https://www.costamare.com/images/presentations/CMRE_Presentation_Q2_2025.pdf'
          fetch '07_CMDB_H1_2025_Earnings_Release.pdf' 'https://www.costamarebulkers.com/images/news/CMDB_Earnings_release_H1_2025.pdf'
          fetch '08_CMRE_Q3_2025_Earnings_Release.pdf' 'https://www.costamare.com/images/news/CMRE_Q3_2025_Earnings_release.pdf'
          fetch '09_CMRE_Q3_2025_Earnings_Presentation.pdf' 'https://www.costamare.com/images/presentations/CMRE_Presentation_Q3_2025.pdf'
          fetch '10_CMRE_FY2025_Earnings_Release.pdf' 'https://www.costamare.com/images/news/CMRE_Q4_2025_Earnings_release.pdf'
          fetch '11_CMRE_Q4_2025_Earnings_Presentation.pdf' 'https://www.costamare.com/images/presentations/CMRE_Presentation_Q4_2025.pdf'
          fetch '12_CMRE_2025_Annual_Report.pdf' 'https://www.costamare.com/images/annual_reports/cmre_2025_20-F.pdf'
          fetch '13_CMDB_FY2025_Earnings_Release.pdf' 'https://www.costamarebulkers.com/images/news/CMDB_Q425_Earnings_Release.pdf'
          fetch '14_CMDB_2025_Annual_Report.pdf' 'https://www.costamarebulkers.com/images/annual_reports/Costamare_Bulkers_Holdings_Limited_20F_Form_2025.pdf'
          fetch '15_CMRE_Q1_2026_Earnings_Release.pdf' 'https://www.costamare.com/images/news/CMRE_Q1_2026_Earnings_release.pdf'
          fetch '16_CMRE_Q1_2026_Earnings_Presentation.pdf' 'https://www.costamare.com/images/presentations/CMRE_Presentation_Q1_2026.pdf'
          fetch '17_CMRE_Q2_2026_Earnings_Release.pdf' 'https://www.costamare.com/images/news/CMRE_Q2_2026_Earnings_release.pdf'
          fetch '18_CMRE_Q2_2026_Earnings_Presentation.pdf' 'https://www.costamare.com/images/presentations/CMRE_Presentation_Q2_2026.pdf'
          fetch '19_CMDB_Q2_2026_Earnings_Release.pdf' 'https://www.costamarebulkers.com/images/news/CMDB_Q2_2026_Earnings_Release.pdf'
          fetch '20_CMDB_Q2_2026_Earnings_Presentation.pdf' 'https://www.costamarebulkers.com/images/news/CMDB_Presentation_Q2_2026.pdf'
          count=$(find sources -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')
          echo "Downloaded $count full source PDFs"
          test "$count" = "20"
          find sources -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload exact source files as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Costamare_20_Official_Full_Sources
          path: sources/*.pdf
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

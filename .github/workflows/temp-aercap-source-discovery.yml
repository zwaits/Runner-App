name: Temp AerCap Source Discovery

on:
  pull_request:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official AerCap PDF links
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup, Tag
          from urllib.parse import urljoin

          url='https://www.aercap.com/investors/financial-information'
          html=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60).text
          print('status length', len(html))
          soup=BeautifulSoup(html,'html.parser')
          targets={'FY 2024','Q1 2025','Q2 2025','Q3 2025','FY 2025','Q1 2026','Q2 2026'}
          for h in soup.find_all(['h2','h3','h4']):
              title=' '.join(h.stripped_strings)
              if title not in targets:
                  continue
              print('\n###', title)
              seen=set()
              node=h.next_sibling
              while node:
                  if isinstance(node, Tag) and node.name in ['h2','h3','h4']:
                      break
                  if isinstance(node, Tag):
                      for a in node.find_all('a', href=True):
                          text=' '.join(a.stripped_strings)
                          href=urljoin(url,a['href'])
                          key=(text,href)
                          if key not in seen:
                              seen.add(key)
                              print(repr(text), '=>', href)
                  node=node.next_sibling
          PY

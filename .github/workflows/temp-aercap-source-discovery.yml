name: Temp AerCap Official Source Bundle

on:
  pull_request:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download 20 full official AerCap source PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          UA='Mozilla/5.0 (compatible; AerCap-source-bundle/1.0)'
          fetch() {
            local name="$1"
            local url="$2"
            echo "Downloading $name"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 240 -A "$UA" "$url" -o "sources/$name"
            test -s "sources/$name"
            test "$(head -c 4 "sources/$name")" = "%PDF"
            sleep 0.2
          }

          fetch 'AER-12.31.2024-20F.pdf' 'https://www.aercap.com/investors/shareholder-services/sec-filings/content/0001378789-25-000007/0001378789-25-000007.pdf'
          fetch '4Q 2024 AerCap Holdings N.V. Earnings Presentation.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/13836/earnings_presentation/4Q+2024+AerCap+Holdings+N.V.+Earnings+Presentation.pdf'

          fetch 'AerCap 2025 First Quarter Earnings Release Final.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14111/earnings_release/AerCap+2025+First+Quarter+Earnings+Release+Final.pdf'
          fetch '1Q 2025 AerCap Holdings N.V. Earnings Presentation Final.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14111/earnings_presentation/1Q+2025+AerCap+Holdings+N.V.+Earnings+Presentation+Final.pdf'
          fetch 'AerCap Holdings N.V. 6-K Interim Financial Report for First Quarter 2025.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/540/14458/file/AerCap+Holdings+N.V.+6-K+Interim+Financial+Report+for+First+Quarter+2025.pdf'

          fetch 'AerCap 2025 Second Quarter Earnings Release.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14490/earnings_release/AerCap+2025+Second+Quarter+Earnings+Release.pdf'
          fetch '2Q 2025 AerCap Holdings N.V. Earnings Presentation.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14490/earnings_presentation/2Q+2025+AerCap+Holdings+N.V.+Earnings+Presentation.pdf'
          fetch 'AerCap Holdings N.V. Filing of Interim Financial Report for the Second Quarter of 2025.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/540/14518/file/AerCap+Holdings+N.V.+Filing+of+Interim+Financial+Report+for+the+Second+Quarter+of+2025.pdf'

          fetch 'AerCap 2025 Third Quarter Earnings Release.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14536/earnings_release/AerCap+2025+Third+Quarter+Earnings+Release.pdf'
          fetch '3Q 2025 AerCap Holdings N.V. Earnings Presentation.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14536/earnings_presentation/3Q+2025+AerCap+Holdings+N.V.+Earnings+Presentation.pdf'
          fetch 'AerCap Holdings N.V. Filing of Interim Financial Report for the Third Quarter of 2025.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/540/14570/file/AerCap+Holdings+N.V.+Filing+of+Interim+Financial+Report+for+the+Third+Quarter+of+2025.pdf'

          fetch 'AerCap 2025 Fourth Quarter Earnings Release.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14594/earnings_release/AerCap+2025+Fourth+Quarter+Earnings+Release.pdf'
          fetch '4Q 2025 AerCap Holdings N.V. Earnings Presentation.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14594/earnings_presentation/4Q+2025+AerCap+Holdings+N.V.+Earnings+Presentation.pdf'
          fetch 'AER-12.31.2025-20F.pdf' 'https://www.aercap.com/investors/shareholder-services/sec-filings/content/0001628280-26-007513/0001628280-26-007513.pdf'

          fetch 'AerCap 2026 First Quarter Earnings Release.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14683/earnings_release/AerCap+2026+First+Quarter+Earnings+Release.pdf'
          fetch '1Q 2026 AerCap Holdings N.V. Earnings Presentation.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14683/earnings_presentation/1Q+2026+AerCap+Holdings+N.V.+Earnings+Presentation.pdf'
          fetch 'AerCap Holdings N.V. Interim Report for 1Q 2026.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/540/14862/file/AerCap+Holdings+N.V.+Interim+Report+for+1Q+2026.pdf'

          fetch 'AerCap 2026 Second Quarter Earnings Release.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14888/earnings_release/AerCap+2026+Second+Quarter+Earnings+Release.pdf'
          fetch '2Q 2026 AerCap Holdings N.V. Earnings Presentation.pdf' 'https://www.aercap.com/_assets/_ba7b1252fe9802aff093ee06c12f4a8e/aercap/db/539/14888/earnings_presentation/2Q+2026+AerCap+Holdings+N.V.+Earnings+Presentation.pdf'
          fetch 'AER-06.30.2026-Interim Report as filed.pdf' 'https://www.aercap.com/_assets/_7ec299baf03b698aa16eb0d07ba1342b/aercap/db/540/14903/file/AER-06.30.2026-Interim+Report+as+filed.pdf'

          count=$(find sources -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')
          echo "Downloaded $count full source PDFs"
          test "$count" = "20"
          find sources -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload exact source PDFs as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AerCap_20_Official_Full_Sources
          path: sources/*.pdf
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

name: Temp Danaos Source Discovery

on:
  pull_request:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official Danaos PDF links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4 requests
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          pages = [
            ('annual','https://www.danaos.com/investors/financial-information/annual-reports/default.aspx'),
            ('events','https://www.danaos.com/investors/events-and-presentations/default.aspx'),
            ('sec2026','https://www.danaos.com/investors/financial-information/sec-filings/default.aspx'),
            ('sec2025','https://www.danaos.com/investors/financial-information/sec-filings/2025/default.aspx'),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          for label,url in pages:
            r=s.get(url,timeout=60); r.raise_for_status()
            soup=BeautifulSoup(r.text,'html.parser')
            print('\n### PAGE',label,url)
            seen=set()
            for a in soup.find_all('a',href=True):
              href=urljoin(url,a['href'])
              txt=' '.join(a.stripped_strings)
              if href in seen: continue
              if '.pdf' in href.lower() or 'sec-filings-details' in href or 'presentation' in txt.lower() or 'annual report' in txt.lower():
                seen.add(href)
                print(repr(txt),'=>',href)
          PY
